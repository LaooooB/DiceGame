name: Dice content staging
on:
  push:
    branches: [work/dice-content-20260915]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package pinned source for local verification
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-dice-source
          path: source.zip
          retention-days: 1
