name: Verify Godot campaign and dice skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package checks
        run: python3 Tools/static_check.py
      - name: Original combat regression
        run: dotnet run --project Tests/DiceGame.Tests.csproj --configuration Release
      - name: Campaign regression
        run: dotnet run --project Tests/Campaign/Campaign.Tests.csproj --configuration Release
      - name: Dice skills and board regression
        run: dotnet run --project Tests/Skills/Skills.Tests.csproj --configuration Release
      - name: Dice roster, rarity and content regression
        run: dotnet run --project Tests/Content/Content.Tests.csproj --configuration Release
      - name: Twenty-five new dice, one hundred branches and mythic transaction regression
        run: dotnet run --project Tests/Expansion/Expansion.Tests.csproj --configuration Release
      - name: Build native game
        run: dotnet build DiceGame.csproj --configuration Debug
      - name: Import and launch pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_mono_linux_x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64
          "$GODOT" --version
          "$GODOT" --headless --editor --import --path "$PWD" --quit
          "$GODOT" --headless --path "$PWD" --quit-after 6 > /tmp/godot-smoke.log 2>&1
          cat /tmp/godot-smoke.log
          grep -q 'CAMPAIGN READY' /tmp/godot-smoke.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-smoke.log
      - name: Native dice roster and catalogue capture
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64
          export LP_NUM_THREADS=2
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --path "$PWD" --audio-driver Dummy --rendering-method gl_compatibility -- --capture-content > /tmp/godot-content.log 2>&1
          cat /tmp/godot-content.log
          grep -q 'CONTENT CAPTURE COMPLETE' /tmp/godot-content.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-content.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            *test-results.json
            Artifacts/static-check.json
            Artifacts/skills-test-results.json
            Artifacts/skills-stress.json
            Artifacts/content-test-results.json
            Artifacts/content-stress.json
            Artifacts/expansion-test-results.json
            /tmp/godot-smoke.log
            /tmp/godot-content.log
            Artifacts/ContentScreenshots/
          retention-days: 7
