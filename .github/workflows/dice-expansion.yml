name: Dice expansion verification
on:
  push:
    branches: [dice-expansion-20]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact tested source
        run: git archive --format=tar HEAD -o /tmp/dice-expansion-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dice-expansion-source
          path: /tmp/dice-expansion-source.tar
          retention-days: 3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package checks
        run: python3 Tools/static_check.py
      - name: Original combat regression
        run: dotnet run --project Tests/DiceGame.Tests.csproj --configuration Release
      - name: Campaign regression
        run: dotnet run --project Tests/Campaign/Campaign.Tests.csproj --configuration Release
      - name: Dice skill regression
        run: dotnet run --project Tests/Skills/Skills.Tests.csproj --configuration Release
      - name: Expansion regression
        shell: bash
        run: |
          if [ -f Tests/Expansion/Expansion.Tests.csproj ]; then
            dotnet run --project Tests/Expansion/Expansion.Tests.csproj --configuration Release
          fi
      - name: Build Godot game
        run: dotnet build DiceGame.csproj --configuration Debug
      - name: Godot 4.6 Mono smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_mono_linux_x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64
          "$GODOT" --headless --editor --import --path "$PWD" --quit
          "$GODOT" --headless --path "$PWD" --quit-after 6 > /tmp/godot-smoke.log 2>&1
          cat /tmp/godot-smoke.log
          grep -q 'CAMPAIGN READY' /tmp/godot-smoke.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/godot-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-expansion-results
          path: |
            *test-results.json
            Artifacts/*test-results.json
            Artifacts/*stress.json
            Artifacts/static-check.json
            /tmp/godot-smoke.log
          retention-days: 7
