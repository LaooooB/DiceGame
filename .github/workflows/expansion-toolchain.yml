name: Expansion toolchain
on:
  push:
    branches: [dice-expansion-20]
    paths: [.github/workflows/expansion-toolchain.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package .NET 8 compiler, runtime and targeting packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")
          SDK=$(ls "$ROOT/sdk" | grep '^8\.' | sort -V | tail -1)
          RUNTIME=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^8\./ {print $2}' | sort -V | tail -1)
          REF=$(ls "$ROOT/packs/Microsoft.NETCore.App.Ref" | grep '^8\.' | sort -V | tail -1)
          HOST=$(ls "$ROOT/packs/Microsoft.NETCore.App.Host.linux-x64" | grep '^8\.' | sort -V | tail -1)
          echo "SDK=$SDK runtime=$RUNTIME references=$REF host=$HOST"
          tar -C "$ROOT" -czf /tmp/dice-net8-sdk.tar.gz dotnet host "shared/Microsoft.NETCore.App/$RUNTIME" "sdk/$SDK" "packs/Microsoft.NETCore.App.Ref/$REF" "packs/Microsoft.NETCore.App.Host.linux-x64/$HOST"
          sha256sum /tmp/dice-net8-sdk.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dice-net8-sdk
          path: /tmp/dice-net8-sdk.tar.gz
          compression-level: 0
          retention-days: 1
