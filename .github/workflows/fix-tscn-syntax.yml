name: Fix TSCN syntax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tscn-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Godot resource floats
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Color(0,0,0,.5)/Color(0,0,0,0.5)/g' Scenes/UI/BattlePage.tscn Scenes/UI/SettlementPage.tscn
          sed -i 's/Color(0,0,0,.65)/Color(0,0,0,0.65)/g' Scenes/UI/OverlayLayer.tscn
          git diff --check
          git config user.name 'DiceGame TSCN Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add Scenes/UI/BattlePage.tscn Scenes/UI/SettlementPage.tscn Scenes/UI/OverlayLayer.tscn
          git commit -m 'Fix Godot scene float syntax'
          git push origin HEAD:main
