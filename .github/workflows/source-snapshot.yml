name: Apply UI refactor
on:
  push:
    branches: [main]
    paths:
      - '.github/ui-refactor-ready'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authored UI and combat pacing patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ui-refactor.patch.bz2
          for f in \
            .github/ui-refactor-000.b64 \
            .github/ui-refactor-001.b64 \
            .github/ui-refactor-002.b64 \
            .github/ui-refactor-003.b64 \
            .github/ui-refactor-z006.b64 \
            .github/ui-refactor-z007.b64 \
            .github/ui-refactor-z008.b64 \
            .github/ui-refactor-z009.b64 \
            .github/ui-refactor-z010.b64 \
            .github/ui-refactor-z011.b64; do
            base64 -d "$f" >> /tmp/ui-refactor.patch.bz2
          done
          echo 'd476b3ca66c86be373de1a5f77b17450ad080b19b100b56996c0aec21753004e  /tmp/ui-refactor.patch' > /tmp/ui-refactor.sha256
          bzip2 -dc /tmp/ui-refactor.patch.bz2 > /tmp/ui-refactor.patch
          sha256sum -c /tmp/ui-refactor.sha256
          git apply --check /tmp/ui-refactor.patch
          git apply /tmp/ui-refactor.patch
          rm .github/ui-refactor-*.b64 .github/ui-refactor-ready
          git config user.name 'DiceGame UI Refactor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild combat pacing and fully node-author UI'
          git push origin HEAD:main
