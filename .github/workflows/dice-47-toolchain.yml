name: Dice 47 isolated validation toolchain
on:
  push:
    branches: [work/dice-47-mythic-20260915]
    paths: [.github/workflows/dice-47-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56aa65e02e04c8d75f3d63c86ccada7353f942c5
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Package pinned source and build dependencies
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o /tmp/dice-source.tar.gz HEAD
          dotnet restore DiceGame.csproj
          tar -C "$HOME/.nuget/packages" -czf /tmp/dice-nuget.tar.gz .
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_mono_linux_x86_64.zip' -o /tmp/dice-godot.zip
          sha256sum /tmp/dice-source.tar.gz /tmp/dice-nuget.tar.gz /tmp/dice-godot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dice-47-source-and-native-dependencies
          path: |
            /tmp/dice-source.tar.gz
            /tmp/dice-nuget.tar.gz
            /tmp/dice-godot.zip
          retention-days: 1
          compression-level: 0
