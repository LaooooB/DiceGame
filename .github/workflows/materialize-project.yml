name: Materialize Godot project

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-dicegame
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap payload
        id: bootstrap
        shell: bash
        run: |
          if [ -f bootstrap/READY ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Project is already materialized."
          fi

      - name: Expand source project
        if: steps.bootstrap.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/materialized
          mkdir -p /tmp/materialized

          try_archive() {
            local dir="$1"
            [ -d "$dir" ] || return 1
            mapfile -t files < <(find "$dir" -maxdepth 1 -type f -name '*.part' | sort)
            [ "${#files[@]}" -gt 0 ] || return 1
            cat "${files[@]}" > /tmp/candidate

            # Candidate A: base64-encoded xz tar.
            if base64 --decode /tmp/candidate > /tmp/candidate.bin 2>/dev/null && xz -t /tmp/candidate.bin 2>/dev/null; then
              rm -rf /tmp/materialized/*
              tar -xJf /tmp/candidate.bin -C /tmp/materialized
            # Candidate B: raw xz tar.
            elif xz -t /tmp/candidate 2>/dev/null; then
              rm -rf /tmp/materialized/*
              tar -xJf /tmp/candidate -C /tmp/materialized
            # Candidate C: base64-encoded gzip tar.
            elif base64 --decode /tmp/candidate > /tmp/candidate.bin 2>/dev/null && gzip -t /tmp/candidate.bin 2>/dev/null; then
              rm -rf /tmp/materialized/*
              tar -xzf /tmp/candidate.bin -C /tmp/materialized
            else
              return 1
            fi

            [ -f /tmp/materialized/project.godot ] || return 1
            [ -f /tmp/materialized/DiceGame.csproj ] || return 1
            [ -f /tmp/materialized/Scenes/Main.tscn ] || return 1
            return 0
          }

          # Prefer the compact final payload; fall back only to an older archive
          # when that archive independently passes the full-project checks above.
          if try_archive bootstrap/slimchunks; then
            echo "Using compact final payload"
          elif try_archive bootstrap/xzchunks; then
            echo "Using validated xz payload"
          elif try_archive bootstrap/chunks; then
            echo "Using validated legacy payload"
          else
            echo "No complete, valid project archive found" >&2
            exit 1
          fi

          cp -a /tmp/materialized/. .
          rm -rf bootstrap

      - name: Set up Python
        if: steps.bootstrap.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        if: steps.bootstrap.outputs.needed == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Regenerate original reference fixtures and art
        if: steps.bootstrap.outputs.needed == 'true'
        shell: bash
        run: |
          node Tools/generate_reference_fixtures.cjs Tests/Original
          python Tools/extract_reference_assets.py Tests/Original
          python Tools/capture_original.py Tests/Original

      - name: Verify required Godot project files
        if: steps.bootstrap.outputs.needed == 'true'
        shell: bash
        run: |
          test -f project.godot
          test -f DiceGame.csproj
          test -f Scenes/Main.tscn
          test -f Assets/Reference/background.png
          test -f Assets/Reference/dice_125.png
          test -f Tests/Fixtures/audio_reference.f32
          test -f Tests/ReferenceScreenshots/menu.png
          grep -q 'width=1920' project.godot || grep -q 'size/viewport_width=1920' project.godot
          grep -q 'height=1080' project.godot || grep -q 'size/viewport_height=1080' project.godot

      - name: Commit complete project
        if: steps.bootstrap.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Godot 4.6 Mono desktop project"
          git push origin HEAD:main
