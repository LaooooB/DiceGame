name: Verify and stage complete 47-dice expansion
on:
  push:
    branches: [work/dice-47-mythic-20260915]
    paths: [.github/workflows/dice-47-publish.yml]
permissions:
  contents: write
concurrency:
  group: dice-47-delivery
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 56aa65e02e04c8d75f3d63c86ccada7353f942c5
      EXPECTED_TREE: aa5993c3ac715ba6af388a19aa1ebd041fe63415
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Decode and verify exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          chunks = [Path(f'Tools/Transport47/payload-{i}.b64') for i in range(1, 8)]
          payload = ''.join(p.read_text().strip() for p in chunks)
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '912ebecc41f579ea112fd484583afb7b41f4f93d0476529ab712fa75700f94e2'
          Path('/tmp/dice47.patch').write_bytes(patch)
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout -b work/dice-47-verified-20260915 "$BASE_SHA"
          git apply --check /tmp/dice47.patch
          git apply --index /tmp/dice47.patch
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --stat
      - name: Package integrity and all 397 regression cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dice47-validation
          python3 Tools/static_check.py | tee /tmp/dice47-validation/static.log
          dotnet run --project Tests/DiceGame.Tests.csproj --configuration Release | tee /tmp/dice47-validation/core.log
          dotnet run --project Tests/Campaign/Campaign.Tests.csproj --configuration Release | tee /tmp/dice47-validation/campaign.log
          dotnet run --project Tests/Skills/Skills.Tests.csproj --configuration Release | tee /tmp/dice47-validation/skills.log
          dotnet run --project Tests/Content/Content.Tests.csproj --configuration Release | tee /tmp/dice47-validation/content.log
          dotnet run --project Tests/Expansion/Expansion.Tests.csproj --configuration Release | tee /tmp/dice47-validation/expansion.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {'core-test-results.json':27, 'campaign-test-results.json':45, 'Artifacts/skills-test-results.json':55, 'Artifacts/content-test-results.json':139, 'Artifacts/expansion-test-results.json':131}
          for filename, count in expected.items():
              result = json.loads(Path(filename).read_text())
              assert result['failed'] == 0 and result['passed'] == count, (filename, result)
          print('397 regression cases passed')
          PY
      - name: Build and launch Godot 4.6 Mono
        shell: bash
        run: |
          set -euo pipefail
          dotnet build DiceGame.csproj --configuration Debug | tee /tmp/dice47-validation/build.log
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_mono_linux_x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64
          "$GODOT" --headless --editor --import --path "$PWD" --quit > /tmp/dice47-validation/import.log 2>&1
          "$GODOT" --headless --path "$PWD" --quit-after 6 > /tmp/dice47-validation/smoke.log 2>&1
          cat /tmp/dice47-validation/smoke.log
          grep -q 'CAMPAIGN READY' /tmp/dice47-validation/smoke.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/dice47-validation/import.log /tmp/dice47-validation/smoke.log
      - name: Native roster, mythic controls and campaign input captures
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64
          timeout 420 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --path "$PWD" --audio-driver Dummy --rendering-method gl_compatibility -- --capture-content > /tmp/dice47-validation/native-content.log 2>&1
          timeout 420 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT" --path "$PWD" --audio-driver Dummy --rendering-method gl_compatibility -- --capture-campaign > /tmp/dice47-validation/native-campaign.log 2>&1
          cat /tmp/dice47-validation/native-content.log /tmp/dice47-validation/native-campaign.log
          grep -q 'CONTENT CAPTURE COMPLETE' /tmp/dice47-validation/native-content.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/dice47-validation/native-content.log /tmp/dice47-validation/native-campaign.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read(name): return json.loads(Path(name).read_text())
          content = read('Artifacts/ContentScreenshots/capture-result.json')
          assert content['completed'] and content['faces'] == 282 and content['screens'] == 22
          controls = read('Artifacts/ContentScreenshots/expansion-control-checks.json')
          assert controls['passed'] == 6 and controls['failed'] == 0
          campaign = read('Artifacts/CampaignScreenshots/input-checks.json')
          assert campaign['passed'] == 23 and campaign['failed'] == 0
          screens = read('Artifacts/CampaignScreenshots/capture_result.json')
          assert screens['completed'] and screens['screens'] == 14
          print('282 faces, 36 screenshots, 29 native control/input checks passed')
          PY
      - name: Publish only verified source, without temporary transport or workflow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git restore --source="$BASE_SHA" --staged --worktree .github/workflows/verify.yml
          git diff --cached --check
          ! git diff --cached --name-only | grep -E '^Tools/Transport47/|^\.github/workflows/dice-47-'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement 25 new dice, 100 upgrades and five mythic laws' -m 'Retain original 22 dice, 24 slots, six distinct deck types and manual release fire. Add bounded combat effects, deterministic mythic state, atomic adjudication/rebirth and native interfaces. Verified on .NET 8.0.408 and Godot 4.6 Mono: 397 tests, 63 integrity checks, 282 faces, 36 screenshots and 29 native control/input checks. CI wiring will be applied separately through the authorized connector.'
          git push origin HEAD:refs/heads/work/dice-47-verified-20260915
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data = {'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'expected_final_tree':'aa5993c3ac715ba6af388a19aa1ebd041fe63415', 'tests':397, 'integrity_checks':63, 'native_checks':29, 'faces':282, 'screenshots':36}
          Path('/tmp/dice47-validation/delivery.json').write_text(json.dumps(data, indent=2))
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-47-verified-delivery
          path: |
            /tmp/dice47-validation/
            *test-results.json
            Artifacts/static-check.json
            Artifacts/skills-test-results.json
            Artifacts/content-test-results.json
            Artifacts/expansion-test-results.json
            Artifacts/ContentScreenshots/
            Artifacts/CampaignScreenshots/
          retention-days: 7
